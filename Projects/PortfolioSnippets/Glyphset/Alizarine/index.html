<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="az-glyphset">
             <div id =az-glyphset-control-panel>
                <div id="az-weight-selector">
                <select id="az-weight-selector-dropdown" name="Weight">
                    <option value="400" selected>Regular</option>
                    <option value="500">Medium</option>
                    <option value="600">SemiBold</option>
                    <option value="700">Bold</option>
                    <option value="800">ExtraBold</option>
                    <option value="900">UltraBold</option>
                </select>
            </div>
            <div id="az-glyphset-variable-slider-div">
                <input type="range" min="400" max="900" value="400" id="az-glyphset-variable-slider" />
                <label id="az-weightlabel">WGHT</label>
            </div>
             </div>
          
    <div id="az-glyphset-parent"></div>
    </div>
</body>
</html>
